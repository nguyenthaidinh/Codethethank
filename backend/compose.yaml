name: unwritten-f55
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gratitude
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: gratitude
    ports:
      - "127.0.0.1:55455:5432"
    volumes:
      - gratitude-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gratitude -d gratitude"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  gratitude-data:
